services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    # Портов наружу нет: брокером пользуются только frigate и guard.

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 30s
    # Frigate держит декодированные кадры в /dev/shm, и объём зависит от
    # разрешения detect-потоков: на камеру нужно (w*h*1.5*9 + 270480) байт.
    # Семь камер в полном разрешении дают ~212 МБ кадров, остальное — кэш
    # записей. Это tmpfs: память занимается по мере использования, не сразу,
    # поэтому запас берём с расчётом на новые камеры.
    shm_size: "2gb"
    # Потолок памяти. Без него утечка внутри Frigate забирает всю машину:
    # ядро уходит в своп, перестаёт отвечать sshd, и вместе с сервером умирает
    # бот, который должен был об этом сообщить. С лимитом ядро убивает только
    # Frigate, и restart поднимает его заново. Обычное потребление ~4 ГБ,
    # включая 2 ГБ /dev/shm, так что запас трёхкратный.
    mem_limit: 12g
    depends_on:
      - mosquitto
    devices:
      # Встроенная графика: VAAPI-декодирование и OpenVINO-детекция.
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Весь /config, а не только config.yml: тут лежат база событий, кэш
      # модели и секрет для сессий. Без этого тома они живут в контейнере и
      # пропадают при каждом пересоздании — вместе с историей событий, а
      # Frigate заводит нового admin со свежим паролем.
      - ./frigate/data:/config
      # На запись: /addcam и /delcam правят этот файл через API Frigate.
      - ./frigate/config.yml:/config/config.yml
      - ${FRIGATE_MEDIA:-./frigate/media}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"   # веб-интерфейс с аутентификацией
      - "8554:8554"   # RTSP-рестрим go2rtc
      - "8555:8555/tcp"
      - "8555:8555/udp"
      # Порт 5000 намеренно не публикуем: это внутренний API без аутентификации,
      # им пользуется только guard по внутренней сети compose.
    environment:
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
      # Kaby Lake: драйвер iHD выбирается автоматически, но на этом поколении
      # срывается под нагрузкой — «Failed to sync surface», после чего Frigate
      # перезапускает ffmpeg. Legacy-драйвер i965 представляется как раз
      # драйвером Kaby Lake и работает стабильно.
      LIBVA_DRIVER_NAME: i965

  guard:
    build: ./guard
    container_name: home-guard
    restart: unless-stopped
    depends_on:
      - mosquitto
      - frigate
    environment:
      CONFIG_PATH: /app/config.yaml
      BOT_TOKEN: ${BOT_TOKEN}
      # Реальный пароль камер нужен только для проверки при /addcam;
      # в конфиг Frigate уезжает плейсхолдер.
      CAM_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      FRIGATE_PASSWORD: ${FRIGATE_PASSWORD:-}
      WATCHDOG_URL: ${WATCHDOG_URL:-}
      WATCHDOG_TOKEN: ${WATCHDOG_TOKEN:-}
      TZ: ${TZ:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Страница телеметрии. Как и Frigate, доступна только из домашней сети.
      - "8090:8090"
    volumes:
      - ./guard/config.yaml:/app/config.yaml:ro
      - ./data:/app/data

volumes:
  mosquitto-data:
