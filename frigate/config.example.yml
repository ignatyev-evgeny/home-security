# Скопируй в frigate/config.yml.
# Файл монтируется на запись: /addcam и /delcam правят его через API Frigate.

mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate

# OpenVINO на встроенной графике i7-7700T (HD Graphics 630).
# Отдельный ускоритель вроде Coral для шести камер не нужен.
detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  # Kaby Lake — VAAPI. Для 10-го поколения и новее в Frigate есть preset-intel-qsv-h264.
  hwaccel_args: preset-vaapi

detect:
  enabled: true
  fps: 5

objects:
  track:
    - person
  filters:
    person:
      # Порог детекции задаётся здесь, а не в боте: так его видно в UI Frigate
      # вместе с картинкой, на которой он сработал.
      min_score: 0.6
      threshold: 0.75

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 5

record:
  enabled: true
  retain:
    # Непрерывную запись не держим — только куски вокруг событий.
    days: 0
    mode: all
  alerts:
    retain:
      days: 5
  detections:
    retain:
      days: 5

cameras:
  # Переименуй по комнатам: имя попадает в подпись к фото и в /cams.
  # Допустимы латиница в нижнем регистре, цифры и _.
  # Пароль подставляется Frigate из переменной окружения FRIGATE_RTSP_PASSWORD.
  # detect и record на одном входе: один процесс ffmpeg, снимки в полном
  # разрешении. На слабом железе вынеси detect на subtype=1 отдельным входом.
  cam_110:
    ffmpeg:
      inputs:
        - path: 'rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.110:554/cam/realmonitor?channel=1&subtype=0'
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect

  cam_111:
    ffmpeg:
      inputs:
        - path: 'rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.111:554/cam/realmonitor?channel=1&subtype=0'
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect

  cam_112:
    ffmpeg:
      inputs:
        - path: 'rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.112:554/cam/realmonitor?channel=1&subtype=0'
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect

  cam_113:
    ffmpeg:
      inputs:
        - path: 'rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.113:554/cam/realmonitor?channel=1&subtype=0'
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect

  cam_115:
    ffmpeg:
      inputs:
        - path: 'rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.115:554/cam/realmonitor?channel=1&subtype=0'
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect

  cam_120:
    ffmpeg:
      inputs:
        - path: 'rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.120:554/cam/realmonitor?channel=1&subtype=0'
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect

  # Камера другого вендора: XiongMai (XM530), приложения iCSee/XMEye.
  # Ссылка нестандартная — логин и пароль лежат в пути, разделитель `_`, а не `&`.
  # Такую камеру /addcam собрать не умеет, она добавляется руками.
  # Как узнать ссылку для чужой камеры — см. README, «Камеры не-Dahua».
  cam_117:
    ffmpeg:
      inputs:
        - path: 'rtsp://192.168.1.117:554/user=admin_password={FRIGATE_RTSP_PASSWORD}_channel=0_stream=0.sdp?real_stream'
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect
    objects:
      # Перед этой камерой часто ходит собака. Трекаем её отдельной меткой,
      # чтобы она попадала во Frigate как dog и была видна в UI, но алертов
      # по ней не было: в guard/config.yaml в alerts.labels только person.
      track:
        - person
        - dog
      filters:
        person:
          min_score: 0.7
          threshold: 0.8
